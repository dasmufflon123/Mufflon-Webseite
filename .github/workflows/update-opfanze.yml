name: Opfanze Datenbank aktualisieren

on:
  push:
    paths:
      - 'Mufflonseite/assets/Opfanze_assets/Extrablatt_2025/**'
      - 'Mufflonseite/assets/Opfanze_assets/Extrablatt_2026/**'
      - 'Mufflonseite/assets/Opfanze_assets/Eventblatt/**'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Skript ausführen
        run: |
          if [ -f "scripts/generate-opfanze-data.py" ]; then
            python scripts/generate-opfanze-data.py
          else
            python generate-opfanze-data.py
          fi

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fügt alle Änderungen sicher hinzu
          git add Mufflonseite/js/Opfanze-data.js
          
          # Commit & Push nur ausführen, wenn sich wirklich was geändert hat
          if git diff --staged --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Opfanze-Datenbank automatisch aktualisiert [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
