<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPFANZE – PDF Archiv</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    .filter-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 10px 20px;
      margin: 0 5px;
      border: none;
      background-color: #3498db;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .filter-btn:hover {
      background-color: #2980b9;
    }

    .pdf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .pdf-card {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }

    .pdf-card h3 {
      font-size: 1.1em;
      margin-top: 0;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .pdf-card .badge {
      display: inline-block;
      padding: 4px 8px;
      font-size: 0.8em;
      border-radius: 4px;
      color: white;
      margin-bottom: 10px;
      width: fit-content;
    }

    .badge-extrablatt {
      background-color: #e67e22;
    }

    .badge-eventblatt {
      background-color: #9b59b6;
    }

    .pdf-viewer {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .pdf-actions {
      margin-top: auto;
      text-align: center;
    }

    .pdf-actions a {
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    .pdf-actions a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>OPFANZE Ausgaben & Dokumente</h1>

  <!-- Filter-Buttons -->
  <div class="filter-container">
    <button class="filter-btn" onclick="filterPDFs('all')">Alle anzeigen</button>
    <button class="filter-btn" onclick="filterPDFs('Extrablatt')">Nur Extrablatt</button>
    <button class="filter-btn" onclick="filterPDFs('Eventblatt')">Nur Eventblatt</button>
  </div>

  <!-- Container für die PDFs -->
  <div id="pdf-container" class="pdf-grid"></div>

  <!-- 1. Zuerst deine Daten einbinden -->
  <script src="Opfanze-data.js"></script>

  <!-- 2. Hier steckt direkt der Anzeige-Code drin (keine script.js nötig!) -->
  <script>
    function renderPDFs(items) {
      const container = document.getElementById("pdf-container");
      if (!container) return;

      container.innerHTML = "";

      if (!items || items.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>Keine Dokumente gefunden. Bitte prüfen, ob opfanze-data.js richtig hochgeladen ist.</p>";
        return;
      }

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "pdf-card";

        const badgeClass = item.typ === "Eventblatt" ? "badge-eventblatt" : "badge-extrablatt";
        
        const fileName = item.file || item.pdf || item.dateiname || item.link;
        const title = item.titel || item.title || item.name || `Ausgabe ${item.id || ''}`;
        const pdfPath = `./pdf/${encodeURIComponent(fileName)}`;

        card.innerHTML = `
          <span class="badge ${badgeClass}">${item.typ || 'Dokument'}</span>
          <h3>${title}</h3>
          <iframe class="pdf-viewer" src="${pdfPath}"></iframe>
          <div class="pdf-actions">
            <a href="${pdfPath}" target="_blank">PDF öffnen ↗</a>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function getData() {
      if (typeof opfanzePDFs !== 'undefined') return opfanzePDFs;
      if (typeof opfanzeData !== 'undefined') return opfanzeData;
      if (typeof data !== 'undefined') return data;
      if (window.opfanzePDFs) return window.opfanzePDFs;
      if (window.opfanzeData) return window.opfanzeData;
      return [];
    }

    function filterPDFs(typ) {
      const allData = getData();
      if (typ === 'all') {
        renderPDFs(allData);
      } else {
        const filtered = allData.filter(item => item.typ === typ);
        renderPDFs(filtered);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const allData = getData();
      renderPDFs(allData);
    });
  </script>
</body>
</html>
