    .insta-scale-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: calc(var(--radius-md) - 4px);
      background: var(--cream-soft);
    }
    /* Instagrams eingebettete Ansicht hat eine feste Breite (540px) und eine
       naturliche, variable Höhe. Statt sie in eine fremde Box zu quetschen
       (= Verzerrung), wird sie in ihrer echten Größe gerendert und dann per
       transform GLEICHMÄSSIG (x und y identisch) herunterskaliert. So bleibt
       jedes Seitenverhältnis exakt erhalten, egal welches Format der Post hat. */
    .insta-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 540px;
      height: 760px;
      border: none;
      transform-origin: top left;
    }

    .content-social-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 720px;
      margin: 0 auto 18px;

    .content-social-row a {
      display: block;
      width: 150px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .content-social-row a:hover { transform: translateY(-3px); }
    .content-social-row img {
      width: 100%;
      display: block;

  <script>
    // Instagram-Einbettungen gleichmäßig skalieren statt verzerren.
    (function () {
      const NATURAL_WIDTH = 540;
      const NATURAL_HEIGHT = 760;

      function skaliereInstaEmbeds() {
        document.querySelectorAll('.insta-scale-wrap').forEach(wrap => {
          const frame = wrap.querySelector('.insta-frame');
          if (!frame) return;
          const breite = wrap.clientWidth;
          const scale = breite / NATURAL_WIDTH;
          frame.style.transform = `scale(${scale})`;
          wrap.style.height = (NATURAL_HEIGHT * scale) + 'px';
        });
      }

      window.addEventListener('load', skaliereInstaEmbeds);
      window.addEventListener('resize', skaliereInstaEmbeds);
      // Direkt auch einmal ausführen, falls "load" schon vorbei ist
      if (document.readyState === 'complete') skaliereInstaEmbeds();
    })();
  </script>
