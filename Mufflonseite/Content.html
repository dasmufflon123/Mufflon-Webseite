    /* ============================================================
       CONTENT — NEUES LAYOUT: Stream oben, Kacheln darunter
       ============================================================ */

    .content-header {
      padding-top: 10px !important;
      padding-bottom: 10px !important;
    }
    .content-header .section-head {
      margin-bottom: 16px !important;
    }
    .content-header .section-head h1 {
      font-size: clamp(1.6rem, 2.5vw, 2.2rem) !important;
    }
    .content-header .section-head .eyebrow {
      font-size: 0.95rem !important;
    }

    .content-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px 20px;
    }

    .stream-wrap {
      width: 100%;
      margin-bottom: 28px;
    }
    .stream-wrap .embed-wrap {
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-lift);
      background: #1c1210;
      max-width: 100%;
    }
    .stream-wrap .embed-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .kachel-section {
      margin-bottom: 28px;
    }
    .kachel-section .kachel-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--horn-brown);
    }
    .kachel-section .kachel-head .icon {
      font-size: 1.4rem;
    }
    .kachel-section .kachel-head .line {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, rgba(107,66,38,0.15), transparent);
    }

    .kachel-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .kachel-item {
      aspect-ratio: 9 / 16;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      background: #1c1210;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      position: relative;
    }
    .kachel-item:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: var(--shadow-lift);
    }
    .kachel-item iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .kachel-item.insta iframe {
      clip-path: inset(0% 0% 0% 0%);
    }

    .content-social-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 720px;
      margin: 0 auto 18px;
    }
    .content-social-row a {
      display: block;
      width: 150px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .content-social-row a:hover { transform: translateY(-3px); }
    .content-social-row img {
      width: 100%;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(62,44,30,0.18));
      border-radius: 12px;
    }

    .embed-wrap .ytp-large-play-button,
    .embed-wrap .ytp-play-button,
    .kachel-item .ytp-large-play-button,
    .kachel-item .ytp-play-button {
      transform: scale(0.55) !important;
      transform-origin: center !important;
    }

    @media (max-width: 820px) {
      .kachel-row {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
    }

    @media (max-width: 600px) {
      .kachel-row {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .content-social-row a {
        width: 100px;
      }
      .kachel-section .kachel-head {
        font-size: 1rem;
      }
    }

    @media (max-width: 480px) {
      .kachel-row {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
    }
  </style>
</head>
