    .archiv-filters { display: flex; gap: 8px; }
    .archiv-filter-btn {

      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px 18px;
      border-radius: 999px;
      border: 2px solid rgba(107, 66, 38, 0.15);
      background: var(--cream-soft);
      color: var(--horn-brown);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .archiv-filter-btn.active,
    .archiv-filter-btn:hover {
      background: var(--terracotta);
      color: #fff;
      border-color: var(--terracotta);
    }

    .archiv-count {
      text-align: center;
      color: var(--text-soft);
      font-family: 'Patrick Hand', cursive;
      font-size: 1.1rem;
      margin-bottom: 18px;
    }

    .archiv-list {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 24px 60px;
    }

    .archiv-row {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--cream-soft);
      border: 2px solid rgba(107, 66, 38, 0.08);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .archiv-row:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow-soft);
    }
    .archiv-row .tag { margin-bottom: 0; flex-shrink: 0; }
    .archiv-row .archiv-titel {
      flex: 1;
      min-width: 0;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      color: var(--text);
      font-size: 0.96rem;
    }
    .archiv-row .archiv-datum {
      flex-shrink: 0;
      color: var(--text-soft);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .archiv-row .archiv-open {
      flex-shrink: 0;
      color: var(--terracotta-dark);
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .archiv-row { flex-wrap: wrap; }
      .archiv-row .archiv-titel { flex: 1 1 100%; order: 1; }
      .archiv-row .tag { order: 0; }
      .archiv-row .archiv-datum { order: 2; }
      .archiv-row .archiv-open { order: 3; margin-left: auto; }
    }

  <script>
    function formatiereDatum(isoDatum) {
      const monate = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
      const [jahr, monat, tag] = isoDatum.split("-").map(Number);
      return `${tag}. ${monate[monat - 1]} ${jahr}`;
    }

    const alle = (typeof OPFANZE_AUSGABEN !== 'undefined' ? OPFANZE_AUSGABEN : [])
      .slice()
      .sort((a, b) => b.datum.localeCompare(a.datum));

    const listEl = document.getElementById('archiv-list');
    const countEl = document.getElementById('archiv-count');
    const searchEl = document.getElementById('archiv-search');
    const filterBtns = document.querySelectorAll('.archiv-filter-btn');

    let aktiverFilter = 'all';

    function render() {
      const suchbegriff = searchEl.value.trim().toLowerCase();

      const gefiltert = alle.filter(a => {
        const typPasst = aktiverFilter === 'all' || a.typ === aktiverFilter;
        const suchePasst = !suchbegriff || a.titel.toLowerCase().includes(suchbegriff);
        return typPasst && suchePasst;
      });

      countEl.textContent = gefiltert.length === alle.length
        ? `${alle.length} Ausgaben insgesamt`
        : `${gefiltert.length} von ${alle.length} Ausgaben`;

      if (gefiltert.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Nichts gefunden — versuch einen anderen Suchbegriff 🌱</div>';
        return;
      }

      listEl.innerHTML = gefiltert.map(a => `
        <a href="${encodeURI(a.pfad)}" target="_blank" rel="noopener" class="archiv-row">
          <span class="tag ${a.typ === 'Eventblatt' ? 'twilight' : 'terracotta'}">${a.typ}</span>
          <span class="archiv-titel">${a.titel}</span>
          <span class="archiv-datum">${formatiereDatum(a.datum)}</span>
          <span class="archiv-open">Öffnen ↗</span>
        </a>
      `).join('');
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        aktiverFilter = btn.dataset.filter;
        render();
      });
    });

    searchEl.addEventListener('input', render);

    render();
  </script>
