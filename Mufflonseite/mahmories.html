  <script src="js/mahmories-data.js"></script>

  <script>
    // ============================================================
    // MAEHMORIES — MIT BUCH COVER (nur rechts) + RÜCKSEITE (nur links)
    // ============================================================

    const MEMBERS = MAHMORIES_MITGLIEDER;

    // Cover: nur rechte Seite (Buch vorne), linke Seite leer
    const COVER_PAGE = { left: null, right: { name: "Cover", seite_links: null, seite_rechts: "assets/mähmories/Buch vorne.png" } };

    // Rückseite: nur linke Seite (Buch hinten), rechte Seite leer
    const BACK_PAGE = { left: { name: "Rückseite", seite_links: "assets/mähmories/Buch hinten.png", seite_rechts: null }, right: null };

    // Seitenliste aufbauen
    let allPages = [];

    // 1. Cover (nur rechte Seite)
    allPages.push(COVER_PAGE);

    // 2. Alle Mitglieder (links + rechts)
    MEMBERS.forEach(m => {
      allPages.push({ left: m, right: m });
    });

    // 3. Rückseite (nur linke Seite)
    allPages.push(BACK_PAGE);

    // ============================================================
    // BUCH-LOGIK
    // ============================================================

    let currentIndex = 0;
    let isAnimating = false;

    const baseLeftImg = document.getElementById('baseLeftImg');
    const baseRightImg = document.getElementById('baseRightImg');
    const flipRight = document.getElementById('flipRight');
    const flipLeft = document.getElementById('flipLeft');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const indicator = document.getElementById('pageIndicator');

    function getPage(index) {
      return allPages[index] || { left: null, right: null };
    }

    function getImageSrc(page, side) {
      const data = side === 'left' ? page.left : page.right;
      if (!data) return '';
      return side === 'left' ? data.seite_links : data.seite_rechts;
    }

    function getImageAlt(page, side) {
      const data = side === 'left' ? page.left : page.right;
      if (!data) return '';
      return data.name || '';
    }

    function setImageWithVisibility(imgElement, src, alt) {
      if (src && src.length > 0) {
        imgElement.src = src;
        imgElement.alt = alt || '';
        imgElement.style.display = 'block';
      } else {
        imgElement.src = '';
        imgElement.alt = '';
        imgElement.style.display = 'none';
      }
    }

    function renderBaseInstant(index) {
      const page = getPage(index);
      const leftSrc = getImageSrc(page, 'left');
      const rightSrc = getImageSrc(page, 'right');

      setImageWithVisibility(baseLeftImg, leftSrc, getImageAlt(page, 'left'));
      setImageWithVisibility(baseRightImg, rightSrc, getImageAlt(page, 'right'));

      // Flip-Bilder
      const leftMember = page.left;
      const rightMember = page.right;

      const flipRightFront = document.getElementById('flipRightFrontImg');
      const flipRightBack = document.getElementById('flipRightBackImg');
      const flipLeftFront = document.getElementById('flipLeftFrontImg');
      const flipLeftBack = document.getElementById('flipLeftBackImg');

      if (rightMember) {
        setImageWithVisibility(flipRightFront, rightMember.seite_rechts || '', rightMember.name || '');
      } else {
        setImageWithVisibility(flipRightFront, '', '');
      }

      if (leftMember) {
        setImageWithVisibility(flipLeftFront, leftMember.seite_links || '', leftMember.name || '');
      } else {
        setImageWithVisibility(flipLeftFront, '', '');
      }

      // Flip-Back-Bilder leeren (werden beim Flip gesetzt)
      setImageWithVisibility(flipRightBack, '', '');
      setImageWithVisibility(flipLeftBack, '', '');

      // Seitenanzeige
      const total = allPages.length;
      let label;
      if (index === 0) label = '📖 Cover';
      else if (index === total - 1) label = '🔚 Rückseite';
      else label = (index) + ' / ' + (total - 2);

      indicator.textContent = label;

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === total - 1;

      // Klappen zurücksetzen
      resetFlapInstant(flipRight, 'rotateY(0deg)');
      resetFlapInstant(flipLeft, 'rotateY(0deg)');
    }

    function resetFlapInstant(flap, transformValue) {
      flap.style.transition = 'none';
      flap.style.transform = transformValue;
      void flap.offsetWidth;
      flap.style.transition = '';
    }

    function turn(direction) {
      if (isAnimating) return;
      const targetIndex = currentIndex + direction;
      if (targetIndex < 0 || targetIndex >= allPages.length) return;
      isAnimating = true;

      const currentPage = getPage(currentIndex);
      const targetPage = getPage(targetIndex);

      if (direction === 1) {
        // Vorwärts
        flipRight.style.zIndex = '10';
        flipLeft.style.zIndex = '4';

        const currentRight = currentPage.right;
        const targetLeft = targetPage.left;

        const flipRightFront = document.getElementById('flipRightFrontImg');
        const flipRightBack = document.getElementById('flipRightBackImg');

        if (currentRight) {
          setImageWithVisibility(flipRightFront, currentRight.seite_rechts || '', currentRight.name || '');
        } else {
          setImageWithVisibility(flipRightFront, '', '');
        }

        if (targetLeft) {
          setImageWithVisibility(flipRightBack, targetLeft.seite_links || '', targetLeft.name || '');
        } else {
          setImageWithVisibility(flipRightBack, '', '');
        }

        const targetRightSrc = getImageSrc(targetPage, 'right');
        setImageWithVisibility(baseRightImg, targetRightSrc, getImageAlt(targetPage, 'right'));

        resetFlapInstant(flipRight, 'rotateY(0deg)');
        requestAnimationFrame(() => {
          flipRight.style.transform = 'rotateY(-180deg)';
        });

        flipRight.addEventListener('transitionend', function onDone() {
          flipRight.removeEventListener('transitionend', onDone);
          const targetLeftSrc = getImageSrc(targetPage, 'left');
          setImageWithVisibility(baseLeftImg, targetLeftSrc, getImageAlt(targetPage, 'left'));

          resetFlapInstant(flipRight, 'rotateY(0deg)');
          flipRight.style.zIndex = '';
          flipLeft.style.zIndex = '';
          currentIndex = targetIndex;
          renderBaseInstant(currentIndex);
          isAnimating = false;
        }, { once: true });

      } else {
        // Rückwärts
        flipLeft.style.zIndex = '10';
        flipRight.style.zIndex = '4';

        const currentLeft = currentPage.left;
        const targetRight = targetPage.right;

        const flipLeftFront = document.getElementById('flipLeftFrontImg');
        const flipLeftBack = document.getElementById('flipLeftBackImg');

        if (currentLeft) {
          setImageWithVisibility(flipLeftFront, currentLeft.seite_links || '', currentLeft.name || '');
        } else {
          setImageWithVisibility(flipLeftFront, '', '');
        }

        if (targetRight) {
          setImageWithVisibility(flipLeftBack, targetRight.seite_rechts || '', targetRight.name || '');
        } else {
          setImageWithVisibility(flipLeftBack, '', '');
        }

        const targetLeftSrc = getImageSrc(targetPage, 'left');
        setImageWithVisibility(baseLeftImg, targetLeftSrc, getImageAlt(targetPage, 'left'));

        resetFlapInstant(flipLeft, 'rotateY(0deg)');
        requestAnimationFrame(() => {
          flipLeft.style.transform = 'rotateY(180deg)';
        });

        flipLeft.addEventListener('transitionend', function onDone() {
          flipLeft.removeEventListener('transitionend', onDone);
          const targetRightSrc = getImageSrc(targetPage, 'right');
          setImageWithVisibility(baseRightImg, targetRightSrc, getImageAlt(targetPage, 'right'));

          resetFlapInstant(flipLeft, 'rotateY(0deg)');
          flipLeft.style.zIndex = '';
          flipRight.style.zIndex = '';
          currentIndex = targetIndex;
          renderBaseInstant(currentIndex);
          isAnimating = false;
        }, { once: true });
      }
    }

    prevBtn.addEventListener('click', () => turn(-1));
    nextBtn.addEventListener('click', () => turn(1));

    const pageJumpInput = document.getElementById('pageJumpInput');
    const pageJumpBtn = document.getElementById('pageJumpBtn');

    function jumpToPage(num) {
      if (isAnimating || isNaN(num)) return;
      const target = Math.min(Math.max(1, num), allPages.length) - 1;
      if (target === currentIndex) return;
      currentIndex = target;
      renderBaseInstant(currentIndex);
      pageJumpInput.value = '';
    }

    pageJumpBtn.addEventListener('click', () => {
      jumpToPage(parseInt(pageJumpInput.value, 10));
    });
    pageJumpInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') jumpToPage(parseInt(pageJumpInput.value, 10));
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') turn(1);
      if (e.key === 'ArrowLeft') turn(-1);
    });

    renderBaseInstant(currentIndex);
  </script>
