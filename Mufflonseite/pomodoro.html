<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro — Das__Mufflon</title>
<link rel="icon" type="image/png" href="assets/mufflon-mascot.png">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #241b15;
    --bg-mid: #3d2b20;
    --bg-warm: #4d392b;
    --cream: #f7ead9;
    --cream-dim: #d9c4a9;
    --ember: #ef8a5c;
    --ember-soft: #f5a96b;
    --peach-glow: #ffbf8a;
    --rust: #c1666b;
    --rust-dark: #a34e53;
    --sage: #8fa681;
    --sage-dark: #6d8560;
    --prio-high: #d9635e;
    --prio-medium: #e3a548;
    --prio-low: #8fa681;
    --glass: rgba(255, 221, 189, 0.14);
    --glass-border: rgba(255, 224, 196, 0.28);
    --text-dark: #3E2C1E;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    background:
      radial-gradient(circle at 10% 12%, rgba(124, 148, 115, 0.10), transparent 38%),
      radial-gradient(circle at 18% 94%, rgba(255, 179, 138, 0.40), transparent 55%),
      radial-gradient(circle at 82% 98%, rgba(246, 184, 196, 0.42), transparent 55%),
      radial-gradient(circle at 50% 102%, rgba(255, 200, 176, 0.30), transparent 60%),
      linear-gradient(180deg, #F6ECDC 0%, #F6ECDC 58%, #FBDBC7 80%, #F6C7D1 100%);
    color: var(--text-dark);
    overflow-x:hidden;
    position:relative;
  }

  .pomodoro-main{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 32px 16px;
    min-height: calc(100vh - 76px);
  }

  /* Fireflies */
  .firefly{
    position:fixed;
    width:4px; height:4px;
    border-radius:50%;
    background: var(--ember-soft);
    box-shadow: 0 0 6px 2px rgba(242,193,78,0.7);
    opacity:0;
    pointer-events:none;
    animation: drift linear infinite, twinkle ease-in-out infinite;
  }
  @keyframes drift{
    from { transform: translateY(0) translateX(0); }
    to   { transform: translateY(-120px) translateX(30px); }
  }
  @keyframes twinkle{
    0%, 100% { opacity: 0; }
    50% { opacity: 0.9; }
  }

  /* Window vine decoration */
  .vine{
    position:fixed;
    top:0; left:0;
    width:120px;
    height:100vh;
    opacity:0.55;
    pointer-events:none;
    z-index:1;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }
  .vine.right{ left:auto; right:0; transform: scaleX(-1); }

  /* Haupt-Layout-Container: setzt beide Panels 5cm weiter nach unten */
  .app{
    position:relative;
    z-index:2;
    display:flex;
    flex-wrap:wrap;
    gap:28px;
    align-items:flex-start; /* Stellt sicher, dass beide Panels oben exakt bündig abschließen */
    justify-content:center;
    max-width: 1080px;
    width:100%;
    margin-top: 65px; /* Ca. 5 cm weiter nach unten versetzt */
  }

  .card{
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    padding: 28px 30px 32px;
    margin: 0; /* Keinerlei vertikale Abweichung */
  }

  .card.todo-card{
    --cream: #3E2C1E;
    --cream-dim: #6B5645;
    background: rgba(251, 245, 234, 0.92);
    border: 1px solid rgba(107, 66, 38, 0.14);
    box-shadow: 0 16px 40px rgba(107, 66, 38, 0.14);
  }
  .card.todo-card h1{ color: #C1662E; text-shadow: none; }

  .user-tag{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    color: var(--cream-dim);
    margin: -6px 0 14px;
  }
  .user-tag .who{ font-weight: 700; color: var(--cream); }
  .user-tag button{
    background: none;
    border: none;
    color: inherit;
    text-decoration: underline;
    cursor: pointer;
    font-size: inherit;
    padding: 0;
  }

  h1{
    font-family:'Caveat', cursive;
    font-size: 2.6rem;
    margin: 0 0 4px;
    color: var(--ember-soft);
    text-shadow: 0 0 18px rgba(242,193,78,0.35);
    text-align:center;
  }
  .subtitle{
    text-align:center;
    color: var(--cream-dim);
    font-size:0.85rem;
    letter-spacing:0.04em;
    margin-bottom: 18px;
  }

  /* Wrapper um die Timer-Karte für die Mufflon-Animation */
  .timer-wrap{
    position: relative;
    z-index: 2;
  }

  .card.timer-card{
    position: relative;
    z-index: 2; /* Liegt VOR dem Mufflon */
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,0.38), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(120,70,45,0.28), transparent 55%),
      linear-gradient(155deg,
        rgba(246,210,168,0.92) 0%,
        rgba(231,164,114,0.92) 32%,
        rgba(217,138,92,0.92) 65%,
        rgba(185,107,74,0.92) 100%);
    backdrop-filter: none;
    border: 1px solid rgba(255,238,220,0.3);
  }

  /* Mufflon Wasser-Animation: Schiebt von hinter der Timer-Karte nach oben heraus */
  .mascot{
    position: absolute;
    left: 50%;
    top: 0;
    width: 130px;
    z-index: 1; /* HINTER der Timer-Karte */
    opacity: 0;
    transform: translate(-50%, 60px); /* Bündig hinter der Karte versteckt */
    transition: transform 0.5s cubic-bezier(.32, 1.25, .38, 1), opacity 0.4s ease;
    pointer-events: none;
  }
  .mascot.peek{
    opacity: 1;
    transform: translate(-50%, -85%); /* Gleitet nach oben heraus */
    pointer-events: auto;
  }
  .mascot-img{
    display:block;
    width: 100%;
    cursor: pointer;
    filter: drop-shadow(0 12px 16px rgba(0,0,0,0.35));
    animation: mascotPulse 4s ease-in-out infinite;
    animation-play-state: paused;
  }
  .mascot.peek .mascot-img{
    animation-play-state: running;
  }
  @keyframes mascotPulse{
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.045); }
  }

  .timer-card{
    width: 300px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .ring-wrap{
    position:relative;
    width: 220px;
    height: 220px;
    margin: 6px 0 22px;
  }
  .ring-wrap svg{ transform: rotate(-90deg); overflow: visible; }
  .ring-bg{ fill:none; stroke: rgba(70,40,18,0.14); stroke-width: 10; }
  .ring-progress{
    fill:none;
    stroke: url(#emberGradient);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.4s linear;
    filter: url(#ringGlow);
  }

  .custom-timer-btn{
    position:absolute;
    left: -14px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #3d2313;
    color: #f5dcc0;
    border: 2px solid rgba(255,255,255,0.25);
    font-size: 1.15rem;
    font-weight: 700;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    z-index: 5;
    transition: transform 0.15s ease;
  }
  .custom-timer-btn:hover{ transform: translateY(-50%) scale(1.1); }

  .custom-timer-popover{
    position:absolute;
    left: -14px;
    top: 50%;
    transform: translate(-100%, -50%) scale(0.95);
    margin-left: -10px;
    background: rgba(33,21,16,0.96);
    border: 1px solid rgba(247,234,217,0.18);
    border-radius: 14px;
    padding: 12px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    width: 140px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 6;
    box-shadow: 0 10px 24px rgba(0,0,0,0.4);
  }
  .custom-timer-popover.open{
    opacity:1;
    pointer-events:auto;
    transform: translate(-100%, -50%) scale(1);
  }
  .ctp-title{
    font-family:'Caveat', cursive;
    font-size: 1.2rem;
    color: var(--ember-soft);
    text-align:center;
    margin-bottom:2px;
  }
  .custom-timer-popover .field-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .custom-timer-popover input{
    width: 54px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(247,234,217,0.2);
    border-radius: 8px;
    padding: 5px 6px;
    color: var(--cream);
    font-family:'Quicksand', sans-serif;
    font-size: 0.85rem;
    outline:none;
  }
  .custom-timer-popover input:focus{ border-color: var(--ember-soft); }
  .custom-timer-popover label{
    font-size: 0.78rem;
    color: var(--cream-dim);
  }
  .custom-timer-popover button{
    margin-top: 4px;
    border:none;
    border-radius: 10px;
    padding: 7px 8px;
    background: linear-gradient(155deg, var(--ember-soft), var(--ember));
    color: #2b1810;
    font-weight:700;
    font-size: 0.82rem;
    cursor:pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  /* ---------- Login-Overlay ---------- */
  .login-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(20,12,8,0.55);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .login-backdrop.open{ display: flex; }
  .login-panel{
    background: rgba(33,21,16,0.97);
    border: 1px solid rgba(247,234,217,0.18);
    border-radius: 18px;
    padding: 26px 26px 22px;
    width: 100%;
    max-width: 280px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    text-align: center;
  }
  .login-panel input{
    width: 100%;
    box-sizing: border-box;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(247,234,217,0.2);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--cream);
    font-family: 'Quicksand', sans-serif;
    font-size: 0.92rem;
    outline: none;
    margin-bottom: 10px;
  }

  /* ---------- Gelber Klebezettel ---------- */
  .sticky-trigger{
    position: absolute;
    top: -10px;
    right: 18px;
    width: 40px;
    height: 40px;
    background: linear-gradient(160deg, #FFF3A0, #FFE066);
    box-shadow: 0 3px 8px rgba(0,0,0,0.22);
    border: none;
    cursor: pointer;
    transform: rotate(6deg);
    animation: stickyWiggle 3.6s ease-in-out infinite;
    z-index: 5;
  }

  .sticky-notes-layer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 200;
  }

  .sticky-note{
    position: fixed;
    width: 220px;
    min-height: 200px;
    background: linear-gradient(165deg, #FFF6B8, #FFE873);
    box-shadow: 0 14px 34px rgba(0,0,0,0.32);
    padding: 14px 14px 16px;
    transform: rotate(-2deg);
    display: flex;
    flex-direction: column;
    font-family: 'Patrick Hand', 'Quicksand', sans-serif;
    pointer-events: auto;
  }
  .sticky-note textarea{
    flex: 1;
    resize: none;
    border: none;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 1.1rem;
    line-height: 1.4;
    color: #4a3c05;
    min-height: 150px;
    overflow: hidden;
  }

  .ring-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .time{
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .status{
    font-size: 0.75rem;
    color: var(--cream-dim);
    margin-top: 4px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .controls{
    display:flex;
    gap: 12px;
  }
  .btn{
    border:none;
    cursor:pointer;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:0.9rem;
    padding: 12px 18px;
    border-radius: 16px;
    display:flex;
    align-items:center;
    gap:7px;
    color: var(--bg-deep);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  }
  .btn:hover{ transform: translateY(-2px); filter: brightness(1.06); }
  .btn:active{ transform: translateY(0px) scale(0.97); }
  .btn svg{ width:16px; height:16px; }

  .btn-play{ background: linear-gradient(155deg, var(--sage) 0%, var(--sage-dark) 100%); color:#1d2b18;}
  .btn-pause{ background: linear-gradient(155deg, var(--ember-soft) 0%, var(--ember) 100%); }
  .btn-stop{ background: linear-gradient(155deg, var(--rust) 0%, var(--rust-dark) 100%); color:#2c1416;}

  /* Todo card */
  .todo-card{
    width: 540px;
    display:flex;
    flex-direction:column;
    position: relative;
  }

  .add-row{
    display:flex;
    gap:8px;
    margin-bottom: 16px;
  }
  .add-row input{
    flex:1;
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 10px 14px;
    color: var(--cream);
    font-family:'Quicksand', sans-serif;
    font-size: 0.92rem;
    outline:none;
  }

  .add-btn{
    width: 42px;
    height: 42px;
    flex-shrink:0;
    border:none;
    cursor:pointer;
    border-radius: 14px;
    background: linear-gradient(155deg, var(--ember-soft), var(--ember));
    color: var(--bg-deep);
    font-size: 1.4rem;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  }

  .todo-list{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:9px;
    max-height: 480px;
    overflow-y:auto;
  }

  @media (max-width: 640px){
    .app{ flex-direction:column; align-items:center; margin-top: 20px; }
    .timer-card, .todo-card{ width: 100%; max-width: 540px; }
    .todo-list{ max-height: 55vh; }
    .pomodoro-main{ padding-bottom: 90px; }
  }

  @media (max-width: 780px){
    .copyright{ display: none; }
  }

  .copyright{
    position: fixed;
    right: 16px;
    bottom: 12px;
    z-index: 3;
    font-family:'Quicksand', sans-serif;
    font-size: 0.78rem;
    color: rgba(62, 44, 30, 0.45);
    letter-spacing: 0.02em;
    pointer-events:none;
  }
</style>
</head>

<svg width="0" height="0">
  <defs>
    <linearGradient id="emberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbf8a"/>
      <stop offset="100%" stop-color="#ef8a5c"/>
    </linearGradient>
    <filter id="ringGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.94  0 1 0 0 0.58  0 0 1 0 0.35  0 0 0 0.9 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>

<div class="app">

  <div class="timer-wrap">
    <div id="mascotImg" class="mascot">
      <img class="mascot-img" src="assets/mufflon-wasser.png" alt="Mufflon mit Wasserglas">
    </div>
    <div class="card timer-card">
      <h1>Mufflon Pomodoro</h1>
      <div class="subtitle">Tu Dinge tuten tun 🍂</div>

      <div class="ring-wrap">
        <button class="custom-timer-btn" id="customTimerBtn" title="Eigene Zeit einstellen" type="button">+</button>

        <div class="custom-timer-popover" id="customTimerPopover">
          <div class="ctp-title">Eigene Zeit</div>
          <div class="field-row">
            <input type="number" id="customHours" min="0" max="24" value="0">
            <label for="customHours">Std</label>
          </div>
          <div class="field-row">
            <input type="number" id="customMinutes" min="0" max="59" value="25">
            <label for="customMinutes">Min</label>
          </div>
          <button type="button" id="customTimerApply">schnubb</button>
        </div>

        <svg width="220" height="220" viewBox="0 0 220 220" style="overflow: visible;">
          <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
          <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100" stroke-dasharray="628.3" stroke-dashoffset="0"></circle>
        </svg>
        <div class="ring-center">
          <div class="time" id="timeDisplay">25:00</div>
          <div class="status" id="statusDisplay">Bereit</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-play" id="playBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Play
        </button>
        <button class="btn btn-pause" id="pauseBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          Pause
        </button>
        <button class="btn btn-stop" id="stopBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
          Stop
        </button>
      </div>
    </div>
  </div>

  <div class="card todo-card">
    <button class="sticky-trigger" id="stickyTrigger" title="Klebezettel" aria-label="Klebezettel öffnen"></button>
    <h1 style="font-size:2.1rem;">Meine Liste</h1>
    <div class="subtitle">für diese Runde</div>

    <div class="user-tag" id="userTag"></div>

    <div class="mode-toggle">
      <button class="mode-chip active" id="modeTodoBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        Aufgabe
      </button>
      <button class="mode-chip" id="modeGroupBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h5l2 2h11v10H3z"/></svg>
        Gruppe
      </button>
    </div>

    <div class="add-row">
      <input type="text" id="todoInput" placeholder="Was steht an?" maxlength="160">
      <button class="add-btn" id="addBtn" title="Hinzufügen">+</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>
  </div>

</div>

<div class="copyright">&copy; Das__Mufflon</div>
<div class="sticky-notes-layer" id="stickyNotesLayer"></div>

</main>

<script>
  // ---------- Fireflies ----------
  const body = document.body;
  const fireflyCount = 22;
  for (let i = 0; i < fireflyCount; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    f.style.left = Math.random() * 100 + 'vw';
    f.style.top = (60 + Math.random() * 40) + 'vh';
    const dur = 6 + Math.random() * 8;
    f.style.animationDuration = dur + 's, ' + (2 + Math.random() * 3) + 's';
    f.style.animationDelay = (Math.random() * dur) + 's, ' + (Math.random() * 3) + 's';
    body.appendChild(f);
  }

  // ---------- Timer ----------
  let TOTAL = 25 * 60;
  let remaining = TOTAL;
  let running = false;
  let intervalId = null;

  const timeDisplay = document.getElementById('timeDisplay');
  const statusDisplay = document.getElementById('statusDisplay');
  const ringProgress = document.getElementById('ringProgress');
  const CIRC = 2 * Math.PI * 100;
  ringProgress.setAttribute('stroke-dasharray', CIRC);

  function render() {
    const m = Math.floor(remaining / 60).toString().padStart(2, '0');
    const s = Math.floor(remaining % 60).toString().padStart(2, '0');
    timeDisplay.textContent = m + ':' + s;
    const offset = CIRC * (1 - remaining / TOTAL);
    ringProgress.style.strokeDashoffset = offset;
  }

  function setStatus(text) {
    statusDisplay.textContent = text;
  }

  function tick() {
    if (remaining <= 0) {
      clearInterval(intervalId);
      running = false;
      setStatus('Fertig! 🌙');
      showMascot();
      return;
    }
    remaining -= 1;
    render();
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    hideMascot(); // Beim Starten verschwindet das Mufflon wieder nach unten
    if (running || remaining <= 0) return;
    running = true;
    setStatus('Läuft …');
    intervalId = setInterval(tick, 1000);
  });

  document.getElementById('pauseBtn').addEventListener('click', () => {
    if (!running) return;
    clearInterval(intervalId);
    running = false;
    setStatus('Pausiert');
    showMascot(); // Beim Pausieren gleitet das Mufflon nach oben heraus
  });

  document.getElementById('stopBtn').addEventListener('click', () => {
    clearInterval(intervalId);
    running = false;
    remaining = TOTAL;
    render();
    setStatus('Bereit');
    hideMascot(); // Beim Stoppen verschwindet das Mufflon nach unten
  });

  render();

  // ---------- Mascot Toggle Functions ----------
  const mascotImg = document.getElementById('mascotImg');
  function showMascot() { mascotImg.classList.add('peek'); }
  function hideMascot() { mascotImg.classList.remove('peek'); }
  mascotImg.addEventListener('click', hideMascot);
</script>

</body>
</html>
