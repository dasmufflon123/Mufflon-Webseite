  <style>
    /* ============================================================
       HIGHLIGHTS — Verbesserte Darstellung
       ============================================================ */

    .highlight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1080px;
      margin: 0 auto;
    }

    .highlight-tile {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      box-shadow: var(--shadow-soft);
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      min-height: 220px;
      cursor: pointer;
    }
    .highlight-tile:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: var(--shadow-lift);
    }

    .highlight-tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.25), transparent 45%),
        linear-gradient(155deg, var(--tile-c1), var(--tile-c2));
    }

    .highlight-tile .label {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 18px 16px 16px;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      background: linear-gradient(0deg, rgba(0,0,0,0.60) 0%, transparent 100%);
      text-align: center;
      line-height: 1.1;
      letter-spacing: 0.02em;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }

    .highlight-tile .label .main-label {
      display: block;
      font-size: 1.15rem;
      line-height: 1.1;
    }

    .highlight-tile .label .sub-label {
      display: none;
      font-size: 0.72rem;
      font-weight: 400;
      opacity: 0.95;
      margin-top: 4px;
      font-family: 'Nunito', sans-serif;
      line-height: 1.15;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      max-width: 95%;
    }

    .highlight-tile:hover .label .sub-label {
      display: block !important;
    }

    .highlight-tile:hover .label .main-label {
      font-size: 1.0rem;
      line-height: 1.1;
    }

    .highlight-tile .label-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    @media (max-width: 640px) {
      .highlight-grid {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 14px;
      }
      .highlight-tile {
        min-height: 160px;
      }
      .highlight-tile .label {
        font-size: 0.95rem;
        padding: 14px 12px 12px;
        min-height: 65px;
      }
      .highlight-tile .label .main-label {
        font-size: 0.95rem;
      }
      .highlight-tile:hover .label .main-label {
        font-size: 0.85rem;
      }
      .highlight-tile .label .sub-label {
        font-size: 0.62rem;
        line-height: 1.1;
      }
    }

    @media (max-width: 480px) {
      .highlight-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .highlight-tile {
        min-height: 140px;
      }
      .highlight-tile .label {
        font-size: 0.8rem;
        padding: 10px 8px 8px;
        min-height: 55px;
      }
      .highlight-tile .label .main-label {
        font-size: 0.8rem;
        line-height: 1.0;
      }
      .highlight-tile:hover .label .main-label {
        font-size: 0.7rem;
      }
      .highlight-tile .label .sub-label {
        font-size: 0.52rem;
        line-height: 1.05;
        margin-top: 2px;
      }
    }
  </style>
</head>

  <script>
    const grid = document.getElementById('highlight-grid');

    HIGHLIGHTS.forEach(h => {
      const tile = document.createElement('a');
      tile.href = h.link || '#';
      tile.className = 'highlight-tile';
      tile.style.setProperty('--tile-c1', h.farbe1);
      tile.style.setProperty('--tile-c2', h.farbe2);

      tile.innerHTML = `
        <span class="label">
          <span class="label-content">
            <span class="main-label">${h.label}</span>
            ${h.sub ? `<span class="sub-label">${h.sub}</span>` : ''}
          </span>
        </span>
      `;

      grid.appendChild(tile);
    });
