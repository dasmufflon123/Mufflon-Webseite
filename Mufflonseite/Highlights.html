  <style>
    .highlight-tile {
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      border-radius: 24px;
      padding: 1.8rem 1.5rem;
      min-height: 200px;
      background: linear-gradient(145deg, var(--tile-c1, #2a2a3a), var(--tile-c2, #1a1a2a));
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      color: #fff;
      overflow: hidden;
    }
    
    .highlight-tile:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }
    
    .highlight-tile .label {
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 0.02em;
      padding: 0;
      display: block;
      text-align: center;
      line-height: 1.2;
      transition: all 0.4s ease;
      position: relative;
      z-index: 2;
    }
    
    .highlight-tile:hover .label {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
    }
    
    .highlight-tile .desc {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      font-size: 1rem;
      line-height: 1.6;
      text-align: center;
      z-index: 1;
    }
    
    .highlight-tile:hover .desc {
      opacity: 1;
      transform: translateY(0);
    }
    
    .toast-notification {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 1rem 2rem;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 500;
      border: 1px solid rgba(255,215,0,0.3);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    
    .toast-notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <div id="toast" class="toast-notification">📝 Mehr dazu kommt noch!</div>

  <script src="js/highlights-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const grid = document.getElementById('highlight-grid');
    const toast = document.getElementById('toast');
    let toastTimer = null;

    HIGHLIGHTS.forEach(h => {
      const tile = document.createElement('a');
      tile.href = h.link || '#';
      tile.className = 'highlight-tile';
      tile.style.setProperty('--tile-c1', h.farbe1);
      tile.style.setProperty('--tile-c2', h.farbe2);
      
      const descText = h.desc || '';
      tile.innerHTML = `
        <span class="label">${h.label}</span>
        <div class="desc">${descText}</div>
      `;
      
      tile.addEventListener('click', function(e) {
        e.preventDefault();
        
        toast.classList.add('show');
        
        if (toastTimer) {
          clearTimeout(toastTimer);
        }
        
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
          toastTimer = null;
        }, 2500);
      });
      
      grid.appendChild(tile);
    });
  </script>
